<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <style>
    .emblem-bg { fill: #000000; }
    .emblem-stroke { stroke: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .emblem-bg { fill: #FFFFFF; }
      .emblem-stroke { stroke: #000000; }
    }
  </style>

  <!-- Square Box matching Akari Team House Emblem -->
  <rect x="0" y="0" width="120" height="120" class="emblem-bg" />

  <!-- Radiating Rays -->
  <!-- Top Ray -->
  <line x1="60" y1="14" x2="60" y2="23" class="emblem-stroke" stroke-width="4" stroke-linecap="round" />
  <!-- Top-Left Ray -->
  <line x1="36" y1="21" x2="43" y2="28" class="emblem-stroke" stroke-width="4" stroke-linecap="round" />
  <!-- Top-Right Ray -->
  <line x1="84" y1="21" x2="77" y2="28" class="emblem-stroke" stroke-width="4" stroke-linecap="round" />
  <!-- Left Ray -->
  <line x1="22" y1="46" x2="31" y2="46" class="emblem-stroke" stroke-width="4" stroke-linecap="round" />
  <!-- Right Ray -->
  <line x1="98" y1="46" x2="89" y2="46" class="emblem-stroke" stroke-width="4" stroke-linecap="round" />

  <!-- Bulb Outer Outline -->
  <path d="M60 32 C45 32 38 42 38 54 C38 64 44 71 49 77 L49 88 L71 88 L71 77 C76 71 82 64 82 54 C82 42 75 32 60 32 Z" fill="none" class="emblem-stroke" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bulb Screws -->
  <line x1="51" y1="94" x2="69" y2="94" class="emblem-stroke" stroke-width="3.5" stroke-linecap="round" />
  <line x1="53" y1="99" x2="67" y2="99" class="emblem-stroke" stroke-width="3.5" stroke-linecap="round" />
  <path d="M56 99 C56 104 64 104 64 99" fill="none" class="emblem-stroke" stroke-width="3" stroke-linecap="round" />

  <!-- Filament inside bulb -->
  <path d="M52 61 L56 48 L64 48 L68 61" fill="none" class="emblem-stroke" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
